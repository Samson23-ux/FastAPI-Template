[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.api_description }}"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "asgi-lifespan",
    "asyncpg",
    {% if cookiecutter.auth_with_google == "yes" %}
    "authlib",
    {% endif %}
    "celery",
    "fastapi[all]",
    "fastapi-limiter",
    "gevent",
    "psycopg",
    "psycopg2",
    "pwdlib[argon2]",
    "pydantic-settings",
    "pyrate-limiter",
    "pytest",
    "pytest-asyncio",
    "python-jose",
    "redis",
    "resend",
    "sentry-sdk",
    "sqlalchemy",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope= "session"
asyncio_default_test_loop_scope= "session"
markers = [
    "rate_limited: run the test with the real rate limiters enabled",
]
